# Frontend (dist) 80-portda, backend faqat localhost:3000 da.
# Serverda: sudo cp deploy/nginx.conf /etc/nginx/sites-available/eses
#           sudo ln -sf /etc/nginx/sites-available/eses /etc/nginx/sites-enabled/eses
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 64.188.59.127;

    root /var/www/eses/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(user|role|laboratory|baselaboratory|patient|region|analysis|baseanalysis|order|pattern|result|company|onlinestorage|globalstorage|plan|subscription) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
