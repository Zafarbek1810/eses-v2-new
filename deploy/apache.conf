# Frontend (dist) eses.uz da — Apache (ahost va h.k.).
# Productionda Apache/2.4 ishlayotgani uchun .htaccess yoki shu vhost kerak.
#
# Variant A (oddiy): build dan keyin dist/.htaccess ni DocumentRoot ga yuklang
#   (public/.htaccess → vite build → dist/.htaccess)
#   va vhost da AllowOverride All qiling.
#
# Variant B: quyidagi VirtualHost ni sites-available ga qo'ying.

<VirtualHost *:443>
    ServerName eses.uz
    ServerAlias www.eses.uz

    DocumentRoot /var/www/eses/dist

    <Directory /var/www/eses/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # .htaccess o'rniga to'g'ridan-to'g'ri (AllowOverride None bo'lsa):
        FallbackResource /index.html
    </Directory>

    # API backend (kerak bo'lsa — portni o'zgartiring)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/
</VirtualHost>
