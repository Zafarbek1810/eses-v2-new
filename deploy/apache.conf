# eses.uz — Apache SPA (path: /showresult/x/y/z)
#
# Muhim: DocumentRoot ichida FallbackResource bo'lmasa /showresult/... 404 beradi.
# Serverda (root):
#   sudo cp deploy/apache.conf /etc/apache2/sites-available/eses.conf
#   sudo a2ensite eses
#   sudo a2enmod rewrite proxy proxy_http ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# DocumentRoot ni o'z serveringizdagi dist yo'liga moslang.

<VirtualHost *:80>
    ServerName eses.uz
    ServerAlias www.eses.uz
    Redirect permanent / https://eses.uz/
</VirtualHost>

<VirtualHost *:443>
    ServerName eses.uz
    ServerAlias www.eses.uz

    # SSL sertifikat yo'llarini hostingga moslang
    # SSLEngine on
    # SSLCertificateFile ...
    # SSLCertificateKeyFile ...

    DocumentRoot /var/www/eses/dist

    <Directory /var/www/eses/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Path route lar uchun asosiy qoida (AllowOverride None bo'lsa ham ishlaydi)
        FallbackResource /index.html
    </Directory>

    # /api → backend (FallbackResource dan oldin proxy ishlaydi)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/
</VirtualHost>
